name: Claude PR Address Feedback

# Claude fix — turns outstanding review feedback into commits.
#
# When it runs: on demand only, never automatically. Reply to a review comment,
# or add a top-level PR comment, containing `@claude-fix`.
#   - reply on a specific review thread -> fixes only that thread
#   - top-level PR comment              -> fixes all unresolved threads
#
# What it does: checks out the PR branch, reads the unresolved review threads
# (GraphQL, so resolution state is accurate), makes the code changes, runs
# focused validation, commits and pushes to the PR branch, posts a summary
# comment, then resolves the threads it actually addressed. Resolved threads are
# ignored entirely. If the branch moved under it, it skips the push rather than
# force-pushing, and asks you to re-trigger. Fork PRs are skipped.
#
# This file is only a thin caller. The workflow, the fix prompt and the coding
# standards all live in tradingtechnologies/tt-pipeline-github-actions:
#   workflow   .github/workflows/claude_pr_fix.yaml
#   standards  standards/<language>-standards.md  (only those matching languages
#              present in the diff are read)
#   docs       .github/docs/workflows/claude_pr_workflows.md
#
# Both the prompt and the standards are overridable per repo, with no change to
# this file:
#   - CLAUDE.md in the repo root is read as authoritative project rules
#   - .github/standards/<language>-standards.md replaces the bundled file of the
#     same name; bundled files you don't override stay in effect
#   - .github/fix-override.md wins over conflicting parts of the shipped fix
#     prompt
#   - behaviour knobs (trigger_phrase, model, timeout_minutes, ...) are `with:`
#     inputs on the reusable workflow
on:
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  fix:
    uses: tradingtechnologies/tt-pipeline-github-actions/.github/workflows/claude_pr_fix.yaml@main
    secrets:
      GH_BEDROCK_IAM: ${{ secrets.GH_BEDROCK_IAM }}
      STANDARDS_READ_TOKEN: ${{ secrets.STANDARDS_READ_TOKEN }}
